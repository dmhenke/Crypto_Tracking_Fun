name: Daily data update and Pages deploy

on:
  schedule:
    - cron: "20 0 * * *"      # 00:20 UTC daily, just after the Coinbase daily candle closes
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Pull data and rebuild dashboard JSON
        run: Rscript scripts/daily_update.R

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv docs/data/*.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data update $(date -u +'%Y-%m-%d')"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # pick up the commit made by the update job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
