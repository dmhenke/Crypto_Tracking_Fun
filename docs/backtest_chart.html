<body>

    {"date": "2026-05-30", "price": 2012.23, "predicted_low": {"usd": 1509.64}, "actual_price_in_1_week": 1580.61}
];

function setup() {
    createCanvas(800, 500);
    noLoop();
}

function draw() {
    background(30);
    let margin = 50;
    let w = width - 2 * margin;
    let h = height - 2 * margin;

    // Draw Price Lines
    stroke(100);
    line(margin, height - margin, width - margin, height - margin);
    line(margin, margin, margin, height - margin);

    for (let i = 0; i < backtestData.length; i++) {
        let x = map(i, 0, backtestData.length - 1, margin, width - margin);
        
        // Actual Price (Line)
        let yActual = map(backtestData[i].actual_price_in_1_week, 1500, 3500, height - margin, margin);
        stroke(0, 200, 255);
        point(x, yActual);
        
        // Predicted Low (Line)
        let yPred = map(backtestData[i].predicted_low.usd, 1500, 3500, height - margin, margin);
        stroke(255, 50, 50);
        point(x, yPred);
    }
    
    fill(255);
    text("Actual Price (Blue) vs Predicted Low (Red)", 50, 30);
}
</script>
</body>
